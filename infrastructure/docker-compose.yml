# MediBridge AI data services. Synthetic-data research/demo platform, not for clinical use.
# Every port binds to 127.0.0.1 only. Secrets come from the repo-root .env (generated by scripts/setup.ps1).
# Run through scripts/start.ps1, or:
#   docker compose -f infrastructure/docker-compose.yml --env-file .env -p medibridge up -d

name: medibridge

services:
  postgres:
    image: postgres:17.10-alpine
    container_name: medibridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      MEDIBRIDGE_APP_USER: ${POSTGRES_APP_USER}
      MEDIBRIDGE_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    command: ["postgres", "-c", "password_encryption=scram-sha-256", "-c", "log_statement=none", "-c", "log_min_duration_statement=-1"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: medibridge-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image ships without curl/wget; bash's /dev/tcp is enough to prove the HTTP port is accepting.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5.26.30-community
    container_name: medibridge-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_usage__report_enabled: "false"
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

volumes:
  pg_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
